 h+='<div class="qa"><b>汇总推论（三条计划各对应一条）</b>① ICPC：算法 = 企业第一看重项（60.3%），奖牌是最便宜的信号放大器，银牌即够用。② 工程：项目权重高于学历 → 深项目 + 压测数据 + 博客，就是你的「学历替代品」。③ AI：增长确认方向，学历门槛决定你的位置在工程侧。数据支持的从来不是「AI 很热所以去做 AI」，而是「AI 的工程底座缺 C++ 人，而你恰好是」。</div></div>';

 h+='<div class="qa"><b>大三</b>工程与 AI 主线 + ICPC 首战。取舍规则：课业 > 主线 > 保底；挂科不允许，主线不砍，砍的永远是保底。</div></div>';
 h+='<div class="card"><div class="hd"><b>防崩三原则（执行差不是意志力问题）</b></div>';
 h+='<div class="qa"><b>断链处理</b>断 1 天 = 正常休息日；断 2 天 = 降级「15 分钟版」（读一道题解，弄懂即打卡）；断满 1 周 = 回来找 Buddy 重排计划，不硬扛。</div>';
 h+='<div class="qa"><b>状态差的日子</b>只做底线题，允许直接看题解学习——3 天内重做销号，这是学习不是作弊。</div>';
 h+='<div class="qa"><b>计划是工具不是主人</b>连续两周完不成底线 = 计划制定错误，执行者无责。砍计划、降目标、保节奏。</div></div>';
 h+='<div class="card"><div class="hd"><b>每周日 20:00 · 复盘五问（已设自动提醒）</b></div>';
 h+='<div class="qa"><b>五问</b>① 本周 AC 几道，对照底线？② 最难一题的题号与卡点（想不出算法 / 想得出写不出 / 写得出调不对）？③ 工程线推进了什么？④ 本周最大时间黑洞？⑤ 下周底线（≤ 本周实际 × 1.1）？</div>';
 h+='<div class="note">点「生成周报」把数据发我，我记录并跟踪趋势。连续记录两周即可画出曲线。唯一不允许的是消失。</div></div>';
  h+='<div class="card"><div class="hd"><b>进度备份与迁移</b></div>';
 h+='<div class="qa">打卡数据只存在你的浏览器本地。换设备 / 清缓存 / 链接变化时：旧版点「导出」得到 JSON 备份文件，新版点「导入」选择该文件即可完整恢复。</div>';
 h+='<div style="padding:0 14px 12px;display:flex;gap:8px">';

 h+='<button onclick="impProg()" style="flex:1;padding:9px 0;border:none;border-radius:9px;background:#E6F1FB;color:#0C447C;border:1px solid #B5D4F4;font-size:13px;font-weight:700">导入进度</button>';

var VIEWS={today:todayView,s1:s1View,s2:s2View,s3:s3View,s4:s4View,s5:s5View,s6:s6View,lh:lhView};
var cur='today';
function go(v){cur=v;render()}
function render(){
 var v=document.getElementById('view');
 v.innerHTML=VIEWS[cur]();
 document.getElementById('navToday').className='navend'+(cur==='today'?' on':'');
 document.getElementById('navLh').className='navend'+(cur==='lh'?' on':'');
 var cs=curStage();
 document.querySelectorAll('.chip').forEach(function(c){c.classList.toggle('on',c.dataset.v===cur)});
 var act=document.querySelector('.chip.on');if(act)act.scrollIntoView({inline:'center',block:'nearest',behavior:'smooth'});
 updateHeader();
 window.scrollTo(0,0);
}
(function buildStrip(){
 var h='';
 STAGES.forEach(function(s,i){h+='<button class="chip" data-v="'+s.id+'" data-si="'+(i+1)+'" onclick="go(\''+s.id+'\')"><b>'+s.nm+'</b>'+s.tm.replace('2026.','26.').replace('2027.','27.').replace('2028.','28.')+'</button>'});
 document.getElementById('strip').innerHTML=h;
})();

document.addEventListener('click',function(e){
 if(e.target.closest('a'))return;
 var it=e.target.closest('.item');
 if(it){var id=it.dataset.id;
  if(done(id)){delete S.items[id];it.classList.remove('done')}
  else{S.items[id]=1;it.classList.add('done')}
  save();
  var sc=it.closest('[data-scope],.card,.week');
  if(sc){var c=sc.querySelector('.hd .cnt');if(c)c.textContent=cntOf(sc)}
  var wk=it.closest('.week');
  if(wk){var hd=wk.querySelector('.r1 .cnt');if(hd)hd.textContent=cntOf(wk)}
  updateHeader();
  if(cur==='today')renderSoon();
  return;
 }
 var wh=e.target.closest('[data-wk]');
 if(wh){wh.parentElement.classList.toggle('open');return}
 var b=e.target.closest('[data-act]');
 if(b){
  if(b.dataset.act==='extra'){S.extra=(S.extra||0)+1;save();toast('已 +1（课外共 '+S.extra+' 题）。这一题算数，别小看积累。');updateHeader();renderSoon()}
  if(b.dataset.act==='report'){makeReport()}
 }
});
var _rt=null;
function renderSoon(){clearTimeout(_rt);_rt=setTimeout(function(){if(cur==='today')render()},450)}

function makeReport(){
 var r=weekRange(TODAY);
 var its=itemsInRange(r[0],r[1]);
 var dn=0,tot=0,up=0,miss=[];
 var day=DAYMAP[TODAY];
 var lb=day&&day.lb?day.lb:(curStage().nm+' · '+curStage().tm);
 var probs=its.filter(function(x){return x.pr});
 var pdn=probs.filter(function(x){return done(x.id)}).length;
 its.forEach(function(x){tot++;if(done(x.id))dn++;else if(x.dt<=TODAY)miss.push(x);if(x.dt>TODAY)up++});
 var lines=[];
 lines.push('【小宝周报 · '+r[0]+' – '+r[1]+'】');
 lines.push('本周：'+lb);
 lines.push('阶段：'+curStage().nm+'（'+curStage().tm+'）');
 lines.push('本周完成：'+dn+' / '+tot+'（题 '+pdn+' / '+probs.length+'），剩余未到 '+up+' 项');
 lines.push('课外加题：+'+(S.extra||0));
 lines.push('当前段位：'+tierOf(probDone()).nm+' · '+probDone()+' 题');
 if(miss.length){lines.push('未完成（已到期）：');miss.forEach(function(x){lines.push('✗ '+({A:'学',B:'题',C:'赛',D:'任',E:'选'})[x.it.t]+' '+(x.it.p?x.it.p+' ':'')+x.it.s)})}
 lines.push('（发这段给 Buddy，周日 20:00 复盘用。数据不会说谎，你已经在路上了。）');
 var txt=lines.join('\n');
 function fallback(){var ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast('周报已复制，去发给你的 Buddy')}catch(e){window.prompt('长按全选复制：',txt)}document.body.removeChild(ta)}
 if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(function(){toast('周报已复制，去发给你的 Buddy')}).catch(fallback)}else fallback();
}

render();
if('serviceWorker' in navigator){addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}
</script>
